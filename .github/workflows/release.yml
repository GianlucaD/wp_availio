name: Build plugin ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP mit sauberem Ordnernamen (availio-dashboard/)
        run: |
          set -euo pipefail
          SLUG=dashboard-for-availio
          mkdir -p "build/${SLUG}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='.gitignore' \
            --exclude='*.zip' \
            --exclude='.fuse_hidden*' \
            --exclude='.DS_Store' \
            --exclude='.*' \
            ./ "build/${SLUG}/"
          cd build
          zip -r "../${SLUG}.zip" "${SLUG}" >/dev/null
          echo "Erstellt: ${SLUG}.zip"

      - name: Release erstellen und ZIP anhängen
        uses: softprops/action-gh-release@v2
        with:
          files: dashboard-for-availio.zip
          generate_release_notes: true
